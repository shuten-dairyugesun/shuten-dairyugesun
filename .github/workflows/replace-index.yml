name: Replace index.html

on:
  push:
    paths:
      - '.github/workflows/replace-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          git config user.name "shuten-dairyugesun"
          git config user.email "shuten-dairyugesun@users.noreply.github.com"
          git rm index.html
          git mv shou-tian-da-long-hua-kuji-opuningushi-zuo.html index.html
          git commit -m "Update: poster link, scrollable opening, flip effects, revised texts and opening"
          git push
