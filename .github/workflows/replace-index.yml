name: Replace index.html with the uploaded file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the uploaded file
        run: |
          git config user.name "shuten-dairyugesun"
          git config user.email "shuten-dairyugesun@users.noreply.github.com"
          git rm index.html
          git mv shou-tian-da-long-hua-kuji-opuningushi-zuo.html index.html
          git commit -m "Update: copyright emphasis, lower card position, horizontal lock, large-text toggle"
          git push
